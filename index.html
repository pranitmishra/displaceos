<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DisplaceOS - Disaster Relief Assistance</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0a0b0e',
            cardbg: '#12141a',
            cardborder: '#222530',
            brandgreen: '#10b981',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS for OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- React & ReactDOM (Production UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Custom Scrollbar and iOS mobile feel */
    body {
      background-color: #07080a;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      touch-action: manipulation;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #2a2e3d;
      border-radius: 9999px;
    }
    .leaflet-popup-content-wrapper {
      background: #181b24;
      color: #fff;
      border-radius: 12px;
      border: 1px solid #2d3345;
    }
    .leaflet-popup-tip {
      background: #181b24;
    }
    /* Pulse animations */
    @keyframes subtle-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
    }
    .pulse-alert {
      animation: subtle-pulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#07080a] min-h-screen text-white font-sans flex justify-center items-start">
  <div id="root" class="w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==============================================================================
    // DEFAULT CONFIGURATION & DISASTER ZONE
    // ==============================================================================
    const INITIAL_DISASTER_ZONE = {
      name: "Disaster Operations Area Alpha",
      lat: 29.3878,  // Default reference coordinates
      lng: 79.5408,
      radiusKm: 25.0 // Active perimeter radius in km
    };

    // Haversine formula to compute distance in kilometers
    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radius of the Earth in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Number((R * c).toFixed(2));
    }

    // ==============================================================================
    // PICTOGRAPH ICONS (Pixel-matching the user reference image)
    // ==============================================================================
    const Icons = {
      // 1. Food: Steaming pot with handles & soup
      Food: () => (
        <svg viewBox="0 0 64 64" className="w-12 h-12" fill="none" xmlns="http://www.w3.org/2000/svg">
          {/* Steam wisps */}
          <path d="M24 16C22 13 24 10 26 8" stroke="#f59e0b" strokeWidth="2.5" strokeLinecap="round" opacity="0.85" />
          <path d="M32 17C30 13 32 9 34 6" stroke="#fbbf24" strokeWidth="2.5" strokeLinecap="round" opacity="0.95" />
          <path d="M40 16C38 13 40 10 42 8" stroke="#f59e0b" strokeWidth="2.5" strokeLinecap="round" opacity="0.85" />
          {/* Pot Handles */}
          <path d="M12 32C9 32 7 34 7 37C7 40 9 42 12 42" stroke="#71717a" strokeWidth="3" strokeLinecap="round" />
          <path d="M52 32C55 32 57 34 57 37C57 40 55 42 52 42" stroke="#71717a" strokeWidth="3" strokeLinecap="round" />
          {/* Main Pot Body */}
          <ellipse cx="32" cy="28" rx="20" ry="7" fill="#3f3f46" stroke="#52525b" strokeWidth="1.5"/>
          <path d="M12 28C12 28 14 50 32 50C50 50 52 28 52 28" fill="url(#potGrad)" stroke="#52525b" strokeWidth="1.5" />
          {/* Soup in Pot */}
          <ellipse cx="32" cy="29" rx="17" ry="5.5" fill="url(#soupGrad)"/>
          <circle cx="28" cy="30" r="1.5" fill="#f59e0b" />
          <circle cx="35" cy="28.5" r="1.2" fill="#ef4444" />
          <circle cx="32" cy="31" r="1.8" fill="#10b981" />
          <defs>
            <linearGradient id="potGrad" x1="12" y1="28" x2="52" y2="50" gradientUnits="userSpaceOnUse">
              <stop stopColor="#27272a"/>
              <stop offset="0.5" stopColor="#3f3f46"/>
              <stop offset="1" stopColor="#18181b"/>
            </linearGradient>
            <linearGradient id="soupGrad" x1="15" y1="29" x2="49" y2="29" gradientUnits="userSpaceOnUse">
              <stop stopColor="#b45309"/>
              <stop offset="0.6" stopColor="#d97706"/>
              <stop offset="1" stopColor="#92400e"/>
            </linearGradient>
          </defs>
        </svg>
      ),

      // 2. Water: Glossy cyan-blue droplet
      Water: () => (
        <svg viewBox="0 0 64 64" className="w-12 h-12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 8C32 8 16 29 16 41C16 49.8366 23.1634 57 32 57C40.8366 57 48 49.8366 48 41C48 29 32 8 32 8Z" 
                fill="url(#waterGrad)" />
          {/* Gloss highlight */}
          <path d="M26 26C23 31 23 37 25 41" stroke="#ffffff" strokeWidth="3.5" strokeLinecap="round" opacity="0.65" />
          <ellipse cx="37" cy="47" rx="3.5" ry="2" fill="#ffffff" opacity="0.4" />
          <defs>
            <linearGradient id="waterGrad" x1="32" y1="8" x2="32" y2="57" gradientUnits="userSpaceOnUse">
              <stop stopColor="#38bdf8"/>
              <stop offset="0.55" stopColor="#0284c7"/>
              <stop offset="1" stopColor="#0369a1"/>
            </linearGradient>
          </defs>
        </svg>
      ),

      // 3. Medicine: Stethoscope
      Medicine: () => (
        <svg viewBox="0 0 64 64" className="w-12 h-12" fill="none" xmlns="http://www.w3.org/2000/svg">
          {/* Earpieces */}
          <circle cx="21" cy="14" r="2.5" fill="#38bdf8" />
          <circle cx="43" cy="14" r="2.5" fill="#38bdf8" />
          <path d="M21 16V22C21 28 26 33 32 33C38 33 43 28 43 22V16" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round" />
          {/* Main Tube */}
          <path d="M32 33V40C32 46 36 50 42 50C48 50 51 45 51 40V36" stroke="#0ea5e9" strokeWidth="3.5" strokeLinecap="round" />
          {/* Diaphragm / Chestpiece */}
          <circle cx="51" cy="33" r="6" fill="#334155" stroke="#94a3b8" strokeWidth="2.5" />
          <circle cx="51" cy="33" r="2.5" fill="#38bdf8" />
        </svg>
      ),

      // 4. Rescue: Nautical Lifebuoy Ring
      Rescue: () => (
        <svg viewBox="0 0 64 64" className="w-12 h-12" fill="none" xmlns="http://www.w3.org/2000/svg">
          {/* Outer circle */}
          <circle cx="32" cy="32" r="24" fill="#ffffff" stroke="#e2e8f0" strokeWidth="1.5" />
          {/* Red Segments */}
          <path d="M32 8A24 24 0 0 1 49 15L40 24A12 12 0 0 0 32 20Z" fill="#ef4444" />
          <path d="M49 49A24 24 0 0 1 32 56V44A12 12 0 0 0 40 40Z" fill="#ef4444" />
          <path d="M15 49A24 24 0 0 1 8 32H20A12 12 0 0 0 24 40Z" fill="#ef4444" />
          <path d="M8 32A24 24 0 0 1 15 15L24 24A12 12 0 0 0 20 32Z" fill="#ef4444" />
          {/* Inner ring cutout */}
          <circle cx="32" cy="32" r="11" fill="#12141a" stroke="#475569" strokeWidth="1.5" />
          {/* Outer lifeline ropes */}
          <circle cx="32" cy="32" r="25" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="5 5" />
        </svg>
      ),

      // 5. Shelter: Camping Tent
      Shelter: () => (
        <svg viewBox="0 0 64 64" className="w-12 h-12" fill="none" xmlns="http://www.w3.org/2000/svg">
          {/* Left Canvas Panel */}
          <path d="M32 14L10 48H32L32 14Z" fill="#f97316" stroke="#ea580c" strokeWidth="1.5" />
          {/* Right Canvas Panel */}
          <path d="M32 14L54 48H32L32 14Z" fill="#ea580c" stroke="#c2410c" strokeWidth="1.5" />
          {/* Tent Door Flap / Entrance */}
          <path d="M32 26L22 48H42L32 26Z" fill="#1e1b18" />
          <path d="M32 14V48" stroke="#fdba74" strokeWidth="1.5" />
          {/* Guy-lines to ground */}
          <path d="M10 48L5 52" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" />
          <path d="M54 48L59 52" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" />
        </svg>
      ),

      // 6. Other: SOS Badge
      SOS: () => (
        <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-red-500 to-rose-700 flex items-center justify-center shadow-lg shadow-red-600/30 border border-red-400/40">
          <span className="text-white font-black tracking-wider text-sm">SOS</span>
        </div>
      ),

      // Camera Outline Icon
      Camera: () => (
        <svg className="w-7 h-7 text-zinc-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" 
                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.8" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      ),

      // Heart Logo
      HeartLogo: () => (
        <div className="w-9 h-9 rounded-xl bg-zinc-900 border border-zinc-700/80 flex items-center justify-center shadow-sm">
          <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" 
                  d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v6m-3-3h6" opacity="0.75" />
          </svg>
        </div>
      ),

      // Globe Icon
      Globe: () => (
        <svg className="w-5 h-5 text-zinc-400 hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" strokeWidth="1.8"/>
          <path strokeWidth="1.8" d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
        </svg>
      )
    };

    // Category Definitions
    const CATEGORIES = [
      { id: 'Food', label: 'Food', icon: Icons.Food, color: 'text-amber-400' },
      { id: 'Water', label: 'Water', icon: Icons.Water, color: 'text-cyan-400' },
      { id: 'Medicine', label: 'Medicine', icon: Icons.Medicine, color: 'text-sky-400' },
      { id: 'Rescue', label: 'Rescue', icon: Icons.Rescue, color: 'text-rose-400' },
      { id: 'Shelter', label: 'Shelter', icon: Icons.Shelter, color: 'text-orange-400' },
      { id: 'Other', label: 'Other', icon: Icons.SOS, color: 'text-red-400' },
    ];

    // ==============================================================================
    // MAIN APP COMPONENT
    // ==============================================================================
    function App() {
      // Navigation state: 'home' | 'request_confirm' | 'photo_confirm' | 'success' | 'official_login' | 'official_dashboard'
      const [currentPage, setCurrentPage] = useState('home');

      // Selection & Input state
      const [selectedCategory, setSelectedCategory] = useState('Food'); // Default 'Food' as in mockup screenshot
      const [capturedPhoto, setCapturedPhoto] = useState(null);
      const [photoFileName, setPhotoFileName] = useState('');
      const [successMessage, setSuccessMessage] = useState('');
      const [lastBeaconId, setLastBeaconId] = useState('');

      // Geolocation & Disaster Geofencing state
      const [userLocation, setUserLocation] = useState(null); // { lat, lng }
      const [locationStatus, setLocationStatus] = useState('prompt'); // 'prompt' | 'granted' | 'denied' | 'error'
      const [disasterZone, setDisasterZone] = useState(() => {
        try {
          const saved = localStorage.getItem('displace_disaster_zone');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return INITIAL_DISASTER_ZONE;
      });
      const [isNearDisaster, setIsNearDisaster] = useState(true);
      const [distanceToDisaster, setDistanceToDisaster] = useState(1.4);
      const [isSimulatedOutside, setIsSimulatedOutside] = useState(false);

      // Official Login & Auth
      const [isOfficialAuthenticated, setIsOfficialAuthenticated] = useState(false);
      const [requestsList, setRequestsList] = useState([]);

      // Supabase Client Config (Persisted in localStorage)
      const [supabaseConfig, setSupabaseConfig] = useState(() => {
        return {
          url: localStorage.getItem('displace_sb_url') || '',
          key: localStorage.getItem('displace_sb_key') || ''
        };
      });

      // 1. Initial Load: Auto-request Location permission & clean old fake requests
      useEffect(() => {
        requestUserLocation();
        loadExistingRequests();
      }, []);

      // 2. Recompute geofence whenever user location or disaster zone updates
      useEffect(() => {
        if (!userLocation) return;
        
        let effectiveLat = userLocation.lat;
        let effectiveLng = userLocation.lng;

        // If user toggles simulation to test "Outside Disaster Zone"
        if (isSimulatedOutside) {
          effectiveLat += 1.8; // ~200 km away
          effectiveLng += 1.5;
        }

        const dist = calculateDistanceKm(effectiveLat, effectiveLng, disasterZone.lat, disasterZone.lng);
        setDistanceToDisaster(dist);
        setIsNearDisaster(dist <= disasterZone.radiusKm);
      }, [userLocation, disasterZone, isSimulatedOutside]);

      // Request Geolocation function
      const requestUserLocation = () => {
        if (!navigator.geolocation) {
          setLocationStatus('denied');
          setUserLocation({ lat: disasterZone.lat, lng: disasterZone.lng });
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const loc = {
              lat: Number(position.coords.latitude.toFixed(6)),
              lng: Number(position.coords.longitude.toFixed(6))
            };
            setUserLocation(loc);
            setLocationStatus('granted');
          },
          (err) => {
            console.warn("Geolocation denied or unavailable:", err.message);
            setLocationStatus('denied');
            setUserLocation({ lat: disasterZone.lat, lng: disasterZone.lng });
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      };

      // Load requests from Supabase / localStorage (Purging all fake mock requests)
      const loadExistingRequests = async () => {
        try {
          const cached = localStorage.getItem('displace_requests');
          if (cached) {
            let parsed = JSON.parse(cached);
            // Remove any legacy fake/seed requests (id starting with 'req-')
            parsed = parsed.filter(r => r.id && !r.id.startsWith('req-'));
            localStorage.setItem('displace_requests', JSON.stringify(parsed));
            setRequestsList(parsed);
          } else {
            setRequestsList([]);
            localStorage.setItem('displace_requests', JSON.stringify([]));
          }
        } catch (e) {
          console.error(e);
          setRequestsList([]);
        }
      };

      // Delete request permanently (used after resolving)
      const handleDeleteRequest = async (reqId) => {
        if (!confirm("Are you sure you want to permanently delete this resolved request?")) return;
        const updated = requestsList.filter(r => r.id !== reqId);
        setRequestsList(updated);
        localStorage.setItem('displace_requests', JSON.stringify(updated));

        // Also delete from Supabase if connected
        if (supabaseConfig.url && supabaseConfig.key && window.supabase) {
          try {
            const sb = window.supabase.createClient(supabaseConfig.url, supabaseConfig.key);
            await sb.from('relief_requests').delete().eq('id', reqId);
          } catch (sbErr) {
            console.warn("Supabase delete note:", sbErr);
          }
        }
      };

      // Handle photo capture / upload
      const handlePhotoFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setPhotoFileName(file.name);
        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
          setCapturedPhoto(uploadEvent.target.result);
        };
        reader.readAsDataURL(file);
      };

      // Submit Request (from Request Confirm Page or Photo Confirm Page)
      const submitReliefRequest = async ({ category, notes, peopleCount, urgency, photo }) => {
        // Enforce Geofence: if outside radius, strictly block submission!
        if (!isNearDisaster) {
          alert(`Submission Blocked: You are located ${distanceToDisaster} km away, which is outside the active disaster radius (${disasterZone.radiusKm} km). Requests are restricted to affected zones.`);
          return null;
        }

        const beaconId = 'DISP-' + Math.floor(1000 + Math.random() * 9000);
        setLastBeaconId(beaconId);

        const newRequest = {
          id: beaconId,
          category: category.toLowerCase(),
          latitude: userLocation ? userLocation.lat : disasterZone.lat,
          longitude: userLocation ? userLocation.lng : disasterZone.lng,
          notes: notes || 'Assistance requested via mobile beacon',
          people_count: peopleCount || 1,
          urgency: urgency || 'high',
          status: 'pending',
          photo_url: photo || capturedPhoto || null,
          created_at: new Date().toISOString()
        };

        // Try Supabase insert if configured
        if (supabaseConfig.url && supabaseConfig.key && window.supabase) {
          try {
            const sb = window.supabase.createClient(supabaseConfig.url, supabaseConfig.key);
            await sb.from('relief_requests').insert([newRequest]);
            console.log("Uploaded successfully to Supabase Database");
          } catch (sbErr) {
            console.warn("Supabase upload note:", sbErr);
          }
        }

        // Always update local cache for real-time reactivity
        const updated = [newRequest, ...requestsList];
        setRequestsList(updated);
        localStorage.setItem('displace_requests', JSON.stringify(updated));

        // Clear captured photo
        setCapturedPhoto(null);
        setPhotoFileName('');

        return beaconId;
      };

      // ============================================================================
      // RENDER CURRENT PAGE ROUTE
      // ============================================================================
      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-[#07080a] flex flex-col justify-between relative shadow-2xl border-x border-zinc-900 overflow-x-hidden">
          
          {/* Top Location / Geofence Simulator Bar (Helpful for test & evaluation) */}
          <div className="bg-[#11131a] px-3 py-1.5 border-b border-zinc-800 text-[11px] flex items-center justify-between z-40">
            <div className="flex items-center gap-1.5 truncate">
              <span className={`w-2 h-2 rounded-full ${isNearDisaster ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
              <span className="text-zinc-300 font-mono">
                {isNearDisaster 
                  ? `Zone Alpha (${distanceToDisaster} km away)` 
                  : `Outside Zone (${distanceToDisaster} km away)`}
              </span>
            </div>
            <div className="flex items-center gap-1">
              <button 
                onClick={() => setIsSimulatedOutside(!isSimulatedOutside)}
                className={`px-2 py-0.5 rounded text-[10px] font-medium transition ${
                  isSimulatedOutside 
                    ? 'bg-rose-900/60 text-rose-300 border border-rose-700' 
                    : 'bg-zinc-800 text-zinc-400 hover:text-white'
                }`}
                title="Toggle between inside and outside disaster zone to test permissions"
              >
                {isSimulatedOutside ? '⚡ Simulating: Far Away' : '✓ Simulating: Inside'}
              </button>
            </div>
          </div>

          {/* PAGE 1: HOMEPAGE (Pixel-identical to user screenshot) */}
          {currentPage === 'home' && (
            <HomePage 
              selectedCategory={selectedCategory}
              setSelectedCategory={setSelectedCategory}
              capturedPhoto={capturedPhoto}
              photoFileName={photoFileName}
              handlePhotoFileChange={handlePhotoFileChange}
              setCapturedPhoto={setCapturedPhoto}
              isNearDisaster={isNearDisaster}
              distanceToDisaster={distanceToDisaster}
              onContinue={() => {
                if (!isNearDisaster) return;
                if (capturedPhoto) {
                  setCurrentPage('photo_confirm');
                } else {
                  setCurrentPage('request_confirm');
                }
              }}
              onOpenOfficialLogin={() => setCurrentPage('official_login')}
            />
          )}

          {/* PAGE 2: REQUEST CONFIRMATION (Dispatched after choosing category) */}
          {currentPage === 'request_confirm' && (
            <RequestConfirmPage 
              category={selectedCategory}
              userLocation={userLocation}
              capturedPhoto={capturedPhoto}
              onBack={() => setCurrentPage('home')}
              onSubmit={async (details) => {
                const beaconId = await submitReliefRequest({
                  category: selectedCategory,
                  ...details,
                  photo: capturedPhoto
                });
                setSuccessMessage("Request submitted, we will reach as soon as possible");
                setCurrentPage('success');
              }}
            />
          )}

          {/* PAGE 3: PHOTO REPORT SUBMISSION */}
          {currentPage === 'photo_confirm' && (
            <PhotoConfirmPage 
              photo={capturedPhoto}
              userLocation={userLocation}
              category={selectedCategory}
              onBack={() => setCurrentPage('home')}
              onSubmit={async (notes) => {
                const beaconId = await submitReliefRequest({
                  category: selectedCategory || 'photo_report',
                  notes: notes || 'Incident photo captured on site',
                  urgency: 'high',
                  photo: capturedPhoto
                });
                setSuccessMessage("Photo submitted successfully");
                setCurrentPage('success');
              }}
            />
          )}

          {/* SUCCESS BANNER & REDIRECT SCREEN */}
          {currentPage === 'success' && (
            <SuccessPage 
              message={successMessage}
              beaconId={lastBeaconId}
              onRedirectHome={() => setCurrentPage('home')}
            />
          )}

          {/* OFFICIAL LOGIN MODAL */}
          {currentPage === 'official_login' && (
            <OfficialLoginModal 
              onSuccess={() => {
                setIsOfficialAuthenticated(true);
                setCurrentPage('official_dashboard');
              }}
              onClose={() => setCurrentPage('home')}
            />
          )}

          {/* OFFICIAL COMMAND CENTER DASHBOARD */}
          {currentPage === 'official_dashboard' && (
            <OfficialDashboard 
              requests={requestsList}
              disasterZone={disasterZone}
              setDisasterZone={setDisasterZone}
              supabaseConfig={supabaseConfig}
              setSupabaseConfig={setSupabaseConfig}
              onUpdateRequestStatus={async (reqId, newStatus) => {
                const updated = requestsList.map(r => r.id === reqId ? { ...r, status: newStatus } : r);
                setRequestsList(updated);
                localStorage.setItem('displace_requests', JSON.stringify(updated));
                if (supabaseConfig.url && supabaseConfig.key && window.supabase) {
                  try {
                    const sb = window.supabase.createClient(supabaseConfig.url, supabaseConfig.key);
                    await sb.from('relief_requests').update({ status: newStatus }).eq('id', reqId);
                  } catch (e) {}
                }
              }}
              onDeleteRequest={handleDeleteRequest}
              onLogout={() => {
                setIsOfficialAuthenticated(false);
                setCurrentPage('home');
              }}
            />
          )}

        </div>
      );
    }

    function SuccessPage({ message, beaconId, onRedirectHome }) {
      const [countdown, setCountdown] = useState(3);

      useEffect(() => {
        const timer = setInterval(() => {
          setCountdown((prev) => {
            if (prev <= 1) {
              clearInterval(timer);
              onRedirectHome();
              return 0;

            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [onRedirectHome]);

      return (
        <div className="flex-1 flex flex-col items-center justify-center p-6 text-center text-white">

        if (mapProvider === 'carto') {
          tileUrl = mapApiKey.trim() 
            ? `https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?api_key=${encodeURIComponent(mapApiKey.trim())}`
            : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
          tileOptions = {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
          };
        } else if (mapProvider === 'satellite') {
          tileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
          tileOptions = {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri World Imagery'
          };
        }

        L.tileLayer(tileUrl, tileOptions).addTo(map);

        // Disaster Perimeter Circle
        const zoneCircle = L.circle([disasterZone.lat, disasterZone.lng], {
          color: '#ef4444',
          fillColor: '#f87171',
          fillOpacity: 0.15,
          radius: disasterZone.radiusKm * 1000 // meters
        }).addTo(map);
        zoneCircle.bindPopup(`<b>${disasterZone.name}</b><br>Radius: ${disasterZone.radiusKm} km`);

        // Plot All User Requests as custom pins
        requests.forEach((req) => {
          let pinColor = '#3b82f6';
          if (req.category === 'rescue' || req.urgency === 'critical') pinColor = '#ef4444';
          else if (req.category === 'food') pinColor = '#f59e0b';
          else if (req.category === 'water') pinColor = '#06b6d4';
          else if (req.category === 'medicine') pinColor = '#38bdf8';
          else if (req.category === 'shelter') pinColor = '#f97316';
          else if (req.photo_url) pinColor = '#10b981';

          const markerHtml = `
            <div style="background:${pinColor}; width:20px; height:20px; border-radius:50%; border:2.5px solid #fff; box-shadow:0 0 8px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:bold;">
            </div>
          `;

          const icon = L.divIcon({
            className: 'disp-pin',
            html: markerHtml,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });

          const popupContent = `
            <div style="font-size:12px; line-height:1.4;">
              <strong style="text-transform:uppercase; color:#f87171;">${req.category} Assistance</strong><br/>
              <b>Status:</b> ${req.status}<br/>
              <b>People:</b> ${(req.people_count === '5+' || req.people_count >= 5 || req.people_count === 6) ? '5+' : (req.people_count || 1)}<br/>
              <b>Note:</b> ${req.notes || 'None'}<br/>
              ${req.photo_url ? `<img src="${req.photo_url}" style="width:100%; max-height:80px; object-fit:cover; margin-top:4px; border-radius:4px;"/>` : ''}
              <div style="margin-top:6px; font-size:10px; color:#94a3b8;">
                Lat: ${Number(req.latitude).toFixed(4)}, Lng: ${Number(req.longitude).toFixed(4)}
              </div>
            </div>
          `;

          L.marker([req.latitude, req.longitude], { icon })
            .addTo(map)
            .bindPopup(popupContent);
        });

        return () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
        };
      }, [activeTab, requests, disasterZone, mapProvider, mapApiKey]);

      // Filtered requests
      const filteredRequests = requests.filter(r => {
        if (filterCategory !== 'all' && r.category !== filterCategory) return false;
        if (filterStatus !== 'all' && r.status !== filterStatus) return false;
        return true;
      });

      return (
        <div className="flex-1 flex flex-col bg-[#0a0b0e] text-white">
          
          {/* Dashboard Header */}
          <div className="bg-[#12141a] px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <h1 className="text-sm font-bold tracking-tight">Official Operations Center</h1>
              </div>
              <p className="text-[10px] text-zinc-400">DisplaceOS Dispatch System</p>
            </div>
            <button
              onClick={onLogout}
              className="text-xs px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium"
            >
              Exit
            </button>
          </div>

          {/* Quick Metrics */}
          <div className="grid grid-cols-4 gap-1.5 p-3 bg-zinc-900/60 border-b border-zinc-800 text-center">
            <div className="p-2 rounded-lg bg-[#12141a] border border-zinc-800">
              <span className="text-[10px] text-zinc-400 block">Total</span>
              <span className="text-base font-bold text-white">{requests.length}</span>
            </div>
            <div className="p-2 rounded-lg bg-[#12141a] border border-zinc-800">
              <span className="text-[10px] text-amber-400 block">Pending</span>
              <span className="text-base font-bold text-amber-400">
                {requests.filter(r => r.status === 'pending').length}
              </span>
            </div>
            <div className="p-2 rounded-lg bg-[#12141a] border border-zinc-800">
              <span className="text-[10px] text-rose-400 block">Critical</span>
              <span className="text-base font-bold text-rose-400">
                {requests.filter(r => r.urgency === 'critical').length}
              </span>
            </div>
            <div className="p-2 rounded-lg bg-[#12141a] border border-zinc-800">
              <span className="text-[10px] text-emerald-400 block">Photos</span>
              <span className="text-base font-bold text-emerald-400">
                {requests.filter(r => r.photo_url).length}
              </span>
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="flex border-b border-zinc-800 bg-[#12141a] text-xs">
            <button
              onClick={() => setActiveTab('map')}
              className={`flex-1 py-2.5 font-medium border-b-2 transition ${
                activeTab === 'map' ? 'border-white text-white' : 'border-transparent text-zinc-400'
              }`}
            >
              🗺️ Live Map
            </button>
            <button
              onClick={() => setActiveTab('list')}
              className={`flex-1 py-2.5 font-medium border-b-2 transition ${
                activeTab === 'list' ? 'border-white text-white' : 'border-transparent text-zinc-400'
              }`}
            >
              📋 Queue ({requests.length})
            </button>
            <button
              onClick={() => setActiveTab('photos')}
              className={`flex-1 py-2.5 font-medium border-b-2 transition ${
                activeTab === 'photos' ? 'border-white text-white' : 'border-transparent text-zinc-400'
              }`}
            >
              📷 Photos ({requests.filter(r => r.photo_url).length})
            </button>
            <button
              onClick={() => setActiveTab('settings')}
              className={`flex-1 py-2.5 font-medium border-b-2 transition ${
                activeTab === 'settings' ? 'border-white text-white' : 'border-transparent text-zinc-400'
              }`}
            >
              ⚙️ Geofence
            </button>
          </div>

          {/* TAB 1: LIVE MAP */}
          {activeTab === 'map' && (
            <div className="flex-1 flex flex-col relative">
              {/* Map Layer & API Key Controller Bar */}
              <div className="px-3 py-1.5 bg-[#141720] border-b border-zinc-800 flex items-center justify-between text-[11px] gap-1">
                <div className="flex items-center gap-1">
                  <span className="text-zinc-400 text-[10px] mr-0.5">Map:</span>
                  <button
                    type="button"
                    onClick={() => {
                      setMapProvider('esri');
                      localStorage.setItem('displace_map_provider', 'esri');
                    }}
                    className={`px-2 py-0.5 rounded text-[10px] font-medium transition ${
                      mapProvider === 'esri' ? 'bg-white text-black font-semibold' : 'bg-zinc-800 text-zinc-300 hover:text-white'
                    }`}
                  >
                    🗺️ Streets
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setMapProvider('satellite');
                      localStorage.setItem('displace_map_provider', 'satellite');
                    }}
                    className={`px-2 py-0.5 rounded text-[10px] font-medium transition ${
                      mapProvider === 'satellite' ? 'bg-white text-black font-semibold' : 'bg-zinc-800 text-zinc-300 hover:text-white'
                    }`}
                  >
                    🛰️ Satellite
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setMapProvider('carto');
                      localStorage.setItem('displace_map_provider', 'carto');
                    }}
                    className={`px-2 py-0.5 rounded text-[10px] font-medium transition ${
                      mapProvider === 'carto' ? 'bg-white text-black font-semibold' : 'bg-zinc-800 text-zinc-300 hover:text-white'
                    }`}
                  >
                    🎨 CARTO
                  </button>
                </div>
                
                <button
                  type="button"
                  onClick={() => setShowApiKeyPrompt(!showApiKeyPrompt)}
                  className={`px-2 py-0.5 rounded text-[10px] border font-mono transition ${
                    mapApiKey 
                      ? 'bg-emerald-950/60 text-emerald-400 border-emerald-700 hover:bg-emerald-900' 
                      : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border-zinc-700'
                  }`}
                  title="Configure Map API Key"
                >
                  🔑 {mapApiKey ? 'API Key ✓' : '+ API Key'}
                </button>
              </div>

              {/* Inline API Key input bar if toggled */}
              {showApiKeyPrompt && (
                <div className="p-2.5 bg-[#181c27] border-b border-zinc-700 text-xs flex items-center gap-2">
                  <span className="text-zinc-300 text-[11px] whitespace-nowrap">API Key:</span>
                  <input
                    type="text"
                    value={mapApiKey}
                    placeholder="Paste CARTO / Map API key..."
                    onChange={(e) => {
                      setMapApiKey(e.target.value);
                      localStorage.setItem('displace_map_api_key', e.target.value);
                    }}
                    className="flex-1 bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-xs text-white placeholder-zinc-500 font-mono"
                  />
                  <button
                    type="button"
                    onClick={() => setShowApiKeyPrompt(false)}
                    className="px-2.5 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-[11px]"
                  >
                    Save
                  </button>
                </div>
              )}

              <div ref={dashboardMapRef} className="flex-1 w-full min-h-[420px]"></div>
              <div className="p-2.5 bg-[#12141a] border-t border-zinc-800 text-[11px] text-zinc-400 flex items-center justify-between">
                <span>🔴 Disaster Zone: {disasterZone.radiusKm} km radius</span>
                <span>Click markers to view requests & dispatch</span>
              </div>
            </div>
          )}

          {/* TAB 2: REQUESTS QUEUE */}
          {activeTab === 'list' && (
            <div className="flex-1 p-3 overflow-y-auto custom-scroll space-y-2.5">
              {/* Category Filter Pills */}
              <div className="flex gap-1.5 overflow-x-auto pb-1 text-[11px]">
                {['all', 'food', 'water', 'medicine', 'rescue', 'shelter', 'other'].map(cat => (
                  <button
                    key={cat}
                    onClick={() => setFilterCategory(cat)}
                    className={`px-2.5 py-1 rounded-full whitespace-nowrap transition ${
                      filterCategory === cat ? 'bg-white text-black font-semibold' : 'bg-zinc-800 text-zinc-400'
                    }`}
                  >
                    {cat.toUpperCase()}
                  </button>
                ))}
              </div>

              {filteredRequests.length === 0 ? (
                <div className="p-8 text-center text-zinc-500 text-xs">
                  No requests matching selected filters.
                </div>
              ) : (
                filteredRequests.map(req => (
                  <div key={req.id} className="p-3.5 rounded-xl bg-[#12141a] border border-zinc-800 text-xs space-y-2">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                          req.urgency === 'critical' ? 'bg-rose-950 text-rose-300 border border-rose-800' : 'bg-zinc-800 text-zinc-300'
                        }`}>
                          {req.category}
                        </span>
                        <span className="font-mono text-zinc-400">{req.id}</span>
                      </div>
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-semibold ${
                        req.status === 'dispatched' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                        req.status === 'resolved' ? 'bg-blue-950 text-blue-400 border border-blue-800' :
                        'bg-amber-950 text-amber-400 border border-amber-800'
                      }`}>
                        {req.status.toUpperCase()}
                      </span>
                    </div>

                    <p className="text-zinc-200 text-xs">{req.notes}</p>

                    <div className="flex items-center justify-between text-[11px] text-zinc-400 pt-1 border-t border-zinc-800/80">
                      <span>👥 {(req.people_count === '5+' || req.people_count >= 5 || req.people_count === 6) ? '5+' : (req.people_count || 1)} people in need</span>
                      <span className="font-mono">{Number(req.latitude).toFixed(4)}, {Number(req.longitude).toFixed(4)}</span>
                    </div>

                    {req.photo_url && (
                      <button 
                        onClick={() => setSelectedPhotoModal(req.photo_url)}
                        className="w-full flex items-center gap-2 p-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-[11px] text-zinc-300 hover:text-white"
                      >
                        <img src={req.photo_url} alt="Site" className="w-8 h-8 rounded object-cover" />
                        <span>Click to view attached incident photo</span>
                      </button>
                    )}

                    {/* Dispatch Action buttons */}
                    <div className="flex gap-2 pt-1">
                      {req.status === 'pending' && (
                        <button
                          onClick={() => onUpdateRequestStatus(req.id, 'dispatched')}
                          className="flex-1 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-[11px]"
                        >
                          Dispatch Team
                        </button>
                      )}
                      {req.status === 'dispatched' && (
                        <button
                          onClick={() => onUpdateRequestStatus(req.id, 'resolved')}
                          className="flex-1 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-[11px]"
                        >
                          Mark Resolved
                        </button>
                      )}
                      {req.status === 'resolved' && (
                        <div className="flex-1 flex items-center justify-between gap-2">
                          <span className="text-[11px] text-emerald-400 font-medium">✓ Case Resolved</span>
                          <button
                            type="button"
                            onClick={() => onDeleteRequest(req.id)}
                            className="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-medium text-[11px] flex items-center gap-1 transition shadow"
                            title="Delete resolved case"
                          >
                            🗑️ Delete Request
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {/* TAB 3: PHOTO INCIDENT GALLERY */}
          {activeTab === 'photos' && (
            <div className="flex-1 p-3 overflow-y-auto custom-scroll">
              <div className="grid grid-cols-2 gap-2.5">
                {requests.filter(r => r.photo_url).length === 0 ? (
                  <div className="col-span-2 p-8 text-center text-zinc-500 text-xs">
                    No photo reports submitted yet.
                  </div>
                ) : (
                  requests.filter(r => r.photo_url).map(req => (
                    <div 
                      key={req.id} 
                      onClick={() => setSelectedPhotoModal(req.photo_url)}
                      className="group rounded-xl overflow-hidden bg-[#12141a] border border-zinc-800 cursor-pointer hover:border-zinc-600 transition"
                    >
                      <img src={req.photo_url} alt="Report" className="w-full h-28 object-cover group-hover:scale-105 transition" />
                      <div className="p-2 text-[10px]">
                        <span className="font-bold uppercase text-emerald-400 block">{req.category}</span>
                        <p className="text-zinc-400 truncate">{req.notes || 'Visual record'}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* TAB 4: GEOFENCE & SUPABASE SETTINGS */}
          {activeTab === 'settings' && (
            <div className="flex-1 p-4 overflow-y-auto custom-scroll space-y-4 text-xs">
              {/* Disaster Geofence Radius */}
              <div className="p-4 rounded-xl bg-[#12141a] border border-zinc-800 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-white text-sm">Disaster Geofence Radius</h3>
                  <span className="px-2.5 py-0.5 rounded-full bg-rose-950 text-rose-300 border border-rose-800 font-mono text-xs font-bold">
                    {disasterZone.radiusKm} km
                  </span>
                </div>
                <p className="text-zinc-400 text-[11px] leading-relaxed">
                  Citizens located outside this radius are completely blocked from submitting requests or uploading photos.
                </p>

                {/* Radius Slider & Number Input */}
                <div className="space-y-2 pt-1">
                  <div className="flex items-center justify-between text-xs text-zinc-300">
                    <span>Allowed Radius:</span>
                    <div className="flex items-center gap-1">
                      <input 
                        type="number" 
                        min="1" 
                        max="200" 
                        value={disasterZone.radiusKm}
                        onChange={(e) => {
                          const val = parseFloat(e.target.value) || 1;
                          const updated = { ...disasterZone, radiusKm: val };
                          setDisasterZone(updated);
                          localStorage.setItem('displace_disaster_zone', JSON.stringify(updated));
                        }}
                        className="w-16 bg-zinc-900 border border-zinc-700 rounded px-2 py-1 text-right text-xs font-mono text-white focus:outline-none focus:border-rose-500"
                      />
                      <span className="text-zinc-400 text-xs">km</span>
                    </div>
                  </div>

                  <input 
                    type="range" 
                    min="1" 
                    max="100" 
                    step="1"
                    value={disasterZone.radiusKm}
                    onChange={(e) => {
                      const val = parseFloat(e.target.value) || 1;
                      const updated = { ...disasterZone, radiusKm: val };
                      setDisasterZone(updated);
                      localStorage.setItem('displace_disaster_zone', JSON.stringify(updated));
                    }}
                    className="w-full accent-rose-500 cursor-pointer"
                  />

                  {/* Quick Radius Presets */}
                  <div className="flex items-center gap-1.5 pt-1">
                    <span className="text-[10px] text-zinc-500 mr-1">Presets:</span>
                    {[5, 10, 25, 50, 100].map((r) => (
                      <button
                        key={r}
                        type="button"
                        onClick={() => {
                          const updated = { ...disasterZone, radiusKm: r };
                          setDisasterZone(updated);
                          localStorage.setItem('displace_disaster_zone', JSON.stringify(updated));
                        }}
                        className={`flex-1 py-1 rounded text-[11px] font-medium transition ${
                          disasterZone.radiusKm === r
                            ? 'bg-white text-black font-bold'
                            : 'bg-zinc-800 text-zinc-300 hover:text-white'
                        }`}
                      >
                        {r}km
                      </button>
                    ))}
                  </div>
                </div>

                <div className="pt-2 border-t border-zinc-800/80 flex items-center justify-between text-[11px] text-zinc-500">
                  <span>Center: {disasterZone.lat.toFixed(4)}, {disasterZone.lng.toFixed(4)}</span>
                  <span className="text-emerald-400 font-mono text-[10px]">Active Geofence</span>
                </div>
              </div>

              {/* Supabase Connection */}
              <div className="p-4 rounded-xl bg-[#12141a] border border-zinc-800 space-y-3">
                <h3 className="font-bold text-white text-sm">Supabase Database Connection</h3>
                <p className="text-zinc-400 text-[11px]">
                  Provide your Supabase Project URL and Anon Public Key to sync directly with PostgreSQL cloud tables.
                </p>

                <div>
                  <label className="text-zinc-400 block mb-1">Supabase URL</label>
                  <input 
                    type="text"
                    placeholder="https://xyzcompany.supabase.co"
                    value={supabaseConfig.url}
                    onChange={(e) => {
                      const updated = { ...supabaseConfig, url: e.target.value };
                      setSupabaseConfig(updated);
                      localStorage.setItem('displace_sb_url', e.target.value);
                    }}
                    className="w-full bg-zinc-900 border border-zinc-700 rounded p-1.5 text-xs text-white"
                  />
                </div>

                <div>
                  <label className="text-zinc-400 block mb-1">Supabase Anon Key</label>
                  <input 
                    type="password"
                    placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    value={supabaseConfig.key}
                    onChange={(e) => {
                      const updated = { ...supabaseConfig, key: e.target.value };
                      setSupabaseConfig(updated);
                      localStorage.setItem('displace_sb_key', e.target.value);
                    }}
                    className="w-full bg-zinc-900 border border-zinc-700 rounded p-1.5 text-xs text-white"
                  />
                </div>

                <div className="pt-2 text-[10px] text-zinc-500 font-mono">
                  Schema script: `supabase_schema.sql` included in root folder.
                </div>
              </div>

              {/* Map Service & API Key Settings */}
              <div className="p-4 rounded-xl bg-[#12141a] border border-zinc-800 space-y-3">
                <h3 className="font-bold text-white text-sm">Map Service & API Key</h3>
                <p className="text-zinc-400 text-[11px]">
                  DisplaceOS defaults to Clean Street Maps (no watermark, no API key needed). If you use CARTO or another tile provider, you can paste your API key below.
                </p>

                <div>
                  <label className="text-zinc-400 block mb-1">Active Map Provider</label>
                  <select
                    value={mapProvider}
                    onChange={(e) => {
                      setMapProvider(e.target.value);
                      localStorage.setItem('displace_map_provider', e.target.value);
                    }}
                    className="w-full bg-zinc-900 border border-zinc-700 rounded p-1.5 text-xs text-white"
                  >
                    <option value="esri">Clean Street Map (Default - 100% Watermark Free, No Key Required)</option>
                    <option value="satellite">Satellite Imagery (High-Res Aerial - No Key Required)</option>
                    <option value="carto">CARTO Voyager (Requires API key below to remove watermark)</option>
                  </select>
                </div>

                <div>
                  <label className="text-zinc-400 block mb-1">Map API Key</label>
                  <input 
                    type="text"
                    placeholder="Enter CARTO / Mapbox API Key"
                    value={mapApiKey}
                    onChange={(e) => {
                      setMapApiKey(e.target.value);
                      localStorage.setItem('displace_map_api_key', e.target.value);
                    }}
                    className="w-full bg-zinc-900 border border-zinc-700 rounded p-1.5 text-xs text-white font-mono placeholder-zinc-500"
                  />
                  <p className="text-[10px] text-zinc-500 mt-1">
                    {mapApiKey ? '✓ API Key configured and stored locally.' : 'No API key entered. Clean Street Map will be used without watermarks.'}
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* Full Screen Image Lightbox Modal */}
          {selectedPhotoModal && (
            <div 
              onClick={() => setSelectedPhotoModal(null)}
              className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4"
            >
              <div className="relative max-w-sm w-full">
                <button 
                  onClick={() => setSelectedPhotoModal(null)}
                  className="absolute -top-10 right-0 text-white font-bold text-lg bg-zinc-800 w-8 h-8 rounded-full flex items-center justify-center"
                >
                  ✕
                </button>
                <img src={selectedPhotoModal} alt="Incident view" className="w-full rounded-2xl shadow-2xl border border-zinc-700" />
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
